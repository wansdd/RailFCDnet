# Parameters
nc: 2 # number of classes
depth_multiple: 1.33 # model depth multiple
width_multiple: 1.25 # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    [-1, 9, C3, [512]],
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
    [-1, 3, C3, [1024]],
    [-1, 1, SPPF, [1024, 5]], # 9
  ]

# YOLOv5 v6.0 head
head: [
    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]], # cat backbone P4
    [-1, 3, C3, [512, False]], # 13

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]], # cat backbone P3
    [-1, 3, C3, [256, False]], # 17 (P3/8-small)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 14], 1, Concat, [1]], # cat head P4
    [-1, 3, C3, [512, False]], # 20 (P4/16-medium)

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 10], 1, Concat, [1]], # cat head P5
    [-1, 3, C3, [1024, False]], # 23 (P5/32-large)
    # 分割分支
    # [-1, 1, Conv, [512, 3, 1]],
    # [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 25: /4 40
    # [[-1, 20], 1, Concat, [1]], # cat head P4
    # [-1, 1, Conv, [256, 3, 1]],
    # [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 28: /2 80
    # [[-1, 17], 1, Concat, [1]], # cat head P3
    # [-1, 1, Conv, [128, 3, 1]],
    [[8, 6], 1, RailStructureFusion, [512, 1024, 256]],
    [[-1, 4], 1, RailStructureFusion, [256, 256, 128]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 31: /1 160
    [-1, 1, Conv, [32, 3, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 33: /1 320
    [-1, 1, Conv, [4, 3, 1]], 
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 35: /1 640

    # b,4,640,640
    [-1, 1, Conv, [1, 1, 1, 3, 1]], # 31: 分割头(还原为原版 Conv=Conv2d+BN+SiLU; 撤销优化#1, 保留#2γ/#3avgpool)
    # D1: 用 PGM 前景图软注意力调制三尺度检测特征(深度可分卷积+残差), 再送检测头
    [[17, 31], 1, PerimeterGuidedRefine, []], # 32: refined P3
    [[20, 31], 1, PerimeterGuidedRefine, []], # 33: refined P4
    [[23, 31], 1, PerimeterGuidedRefine, []], # 34: refined P5
    # 检测分支(基于周界精炼后的特征)
    [[32, 33, 34], 1, Detect, [nc, anchors]], # 35: Detect(P3, P4, P5)

  ]
